name: Refresh NFL model

on:
  schedule:
    - cron: "0 10 * * 2"
    - cron: "0 14 * * 4,6,0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build predictions
        run: python -m nfl_model.pipeline
      - name: Commit refreshed outputs
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add outputs/
          git diff --cached --quiet || (git commit -m "Refresh model outputs" && git push)
